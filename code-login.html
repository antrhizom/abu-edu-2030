<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABU EBA - Login erstellen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ktzh-blue: #0066CC;
            --ktzh-cyan: #00A0E0;
            --ktzh-lightblue: #E8F4F8;
            --ktzh-darkgray: #3C3C3B;
            --ktzh-gray: #767676;
            --white: #FFFFFF;
            --error: #EF4444;
            --success: #10B981;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: var(--ktzh-darkgray);
            line-height: 1.6;
            background: linear-gradient(135deg, var(--ktzh-blue) 0%, var(--ktzh-cyan) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-container {
            background: var(--white);
            border-radius: 30px;
            padding: 3rem;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .logo h1 {
            font-size: 2rem;
            color: var(--ktzh-blue);
            margin-bottom: 0.5rem;
        }

        .logo p {
            color: var(--ktzh-gray);
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--ktzh-darkgray);
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--ktzh-lightblue);
            border-radius: 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--ktzh-blue);
            box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1);
        }

        .symbol-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .symbol-option {
            font-size: 1.75rem;
            padding: 0.5rem;
            border: 2px solid var(--ktzh-lightblue);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1;
            line-height: 1;
        }

        .symbol-option:hover {
            transform: scale(1.1);
            border-color: var(--ktzh-cyan);
        }

        .symbol-option.selected {
            background: var(--ktzh-blue);
            border-color: var(--ktzh-blue);
            transform: scale(1.15);
        }

        .code-preview {
            background: var(--ktzh-lightblue);
            padding: 1.5rem;
            border-radius: 15px;
            margin: 2rem 0;
            text-align: center;
        }

        .code-preview p {
            font-size: 0.875rem;
            color: var(--ktzh-gray);
            margin-bottom: 0.5rem;
        }

        .code-preview .code {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--ktzh-blue);
            font-family: 'Courier New', monospace;
        }

        .btn {
            width: 100%;
            padding: 1.25rem;
            border: none;
            border-radius: 20px;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--ktzh-blue), var(--ktzh-cyan));
            color: var(--white);
            box-shadow: 0 8px 24px rgba(0, 102, 204, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0, 102, 204, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            padding: 1rem;
            border-radius: 15px;
            margin-top: 1rem;
            text-align: center;
            font-weight: 600;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 2px solid var(--error);
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 2px solid var(--success);
        }

        .helper-text {
            font-size: 0.875rem;
            color: var(--ktzh-gray);
            margin-top: 0.5rem;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--ktzh-blue);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: var(--ktzh-cyan);
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 2rem;
            }

            .symbol-grid {
                grid-template-columns: repeat(8, 1fr);
            }

            .symbol-option {
                font-size: 1.4rem;
                padding: 0.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">🎓</div>
            <h1>Login erstellen</h1>
            <p>Erstelle deinen persönlichen Zugang</p>
        </div>

        <form id="loginForm">
            <!-- Name -->
            <div class="form-group">
                <label for="name">Dein Vorname</label>
                <input 
                    type="text" 
                    id="name" 
                    placeholder="z.B. Anna" 
                    required
                    maxlength="20"
                    autocomplete="off"
                >
                <div class="helper-text">Nur dein Vorname (ohne Sonderzeichen)</div>
            </div>

            <!-- Lehrstart -->
            <div class="form-group">
                <label for="year">Lehrstart (Jahr)</label>
                <select id="year" required>
                    <option value="">Bitte wählen...</option>
                    <option value="23">2023</option>
                    <option value="24">2024</option>
                    <option value="25">2025</option>
                    <option value="26">2026</option>
                    <option value="27">2027</option>
                    <option value="28">2028</option>
                    <option value="29">2029</option>
                    <option value="30">2030</option>
                </select>
            </div>

            <!-- Symbol -->
            <div class="form-group">
                <label>Wähle dein Symbol</label>
                <div class="symbol-grid" id="symbolGrid"></div>
                <input type="hidden" id="symbol" required>
                <div class="helper-text">Wähle ein Symbol, das dir gefällt</div>
            </div>

            <!-- PIN -->
            <div class="form-group">
                <label for="pin">Deine 4-stellige PIN</label>
                <input 
                    type="password" 
                    id="pin" 
                    placeholder="z.B. 1234" 
                    required
                    maxlength="4"
                    pattern="[0-9]{4}"
                    inputmode="numeric"
                    autocomplete="off"
                >
                <div class="helper-text">4 Zahlen, die du dir gut merken kannst</div>
            </div>

            <!-- Code Preview -->
            <div class="code-preview">
                <p>Dein generierter Code:</p>
                <div class="code" id="codePreview">---</div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary" id="submitBtn" disabled>
                Code erstellen & einloggen
            </button>

            <!-- Message -->
            <div id="message"></div>
        </form>

        <a href="index.html" class="back-link">← Zurück zur Startseite</a>
    </div>

    <script>
        // 50 diverse Symbole
        const symbols = [
            '🦁', '🌟', '⚡', '🎨', '🚀', '💎', '🌈', '🔥', '🌺', '🎯',
            '🐯', '🦄', '🌸', '⭐', '💫', '🎭', '🎪', '🎬', '🎵', '🎸',
            '⚽', '🏀', '🎾', '🏆', '🎮', '🎲', '🧩', '🎰', '🎳', '🎯',
            '🌍', '🌙', '☀️', '⛅', '🌊', '🏔️', '🌴', '🍀', '🌻', '🌹',
            '🦋', '🐝', '🐞', '🦜', '🐬', '🦈', '🐙', '🦀', '🐢', '🦎'
        ];

        const symbolGrid = document.getElementById('symbolGrid');
        const symbolInput = document.getElementById('symbol');
        const nameInput = document.getElementById('name');
        const yearSelect = document.getElementById('year');
        const pinInput = document.getElementById('pin');
        const codePreview = document.getElementById('codePreview');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        const form = document.getElementById('loginForm');

        // Render symbols
        symbols.forEach(symbol => {
            const div = document.createElement('div');
            div.className = 'symbol-option';
            div.textContent = symbol;
            div.addEventListener('click', () => selectSymbol(symbol, div));
            symbolGrid.appendChild(div);
        });

        function selectSymbol(symbol, element) {
            // Remove previous selection
            document.querySelectorAll('.symbol-option').forEach(el => {
                el.classList.remove('selected');
            });
            
            // Add selection
            element.classList.add('selected');
            symbolInput.value = symbol;
            
            updatePreview();
            checkFormValidity();
        }

        function updatePreview() {
            const name = nameInput.value.trim().toUpperCase() || '---';
            const year = yearSelect.value || '--';
            const symbol = symbolInput.value || '❓';
            const pin = pinInput.value ? '••••' : '----';
            
            codePreview.textContent = `${name}-${year}-${symbol}-${pin}`;
        }

        function checkFormValidity() {
            const isValid = 
                nameInput.value.trim() !== '' &&
                yearSelect.value !== '' &&
                symbolInput.value !== '' &&
                pinInput.value.length === 4 &&
                /^[0-9]{4}$/.test(pinInput.value);
            
            submitBtn.disabled = !isValid;
        }

        // Update preview on input
        nameInput.addEventListener('input', () => {
            // Remove special characters, keep only letters
            nameInput.value = nameInput.value.replace(/[^a-zA-ZäöüÄÖÜ]/g, '');
            updatePreview();
            checkFormValidity();
        });

        yearSelect.addEventListener('change', () => {
            updatePreview();
            checkFormValidity();
        });

        pinInput.addEventListener('input', () => {
            // Keep only numbers
            pinInput.value = pinInput.value.replace(/[^0-9]/g, '');
            updatePreview();
            checkFormValidity();
        });

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = nameInput.value.trim().toUpperCase();
            const year = yearSelect.value;
            const symbol = symbolInput.value;
            const pin = pinInput.value;
            
            const code = `${name}-${year}-${symbol}-${pin}`;
            
            // Simulate backend check (replace with actual API call)
            const isAvailable = await checkCodeAvailability(code);
            
            if (isAvailable) {
                showMessage('success', '✅ Code erfolgreich erstellt! Du wirst weitergeleitet...');
                
                // Store code (replace with actual authentication)
                localStorage.setItem('abuEbaCode', code);
                localStorage.setItem('abuEbaName', name);
                
                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = 'startzweig.html';
                }, 2000);
            } else {
                showMessage('error', '❌ Diese Kombination ist bereits vergeben. Bitte wähle ein anderes Symbol oder eine andere PIN.');
            }
        });

        async function checkCodeAvailability(code) {
            // TODO: Replace with actual backend API call
            // For now, simulate with localStorage check
            const existingCodes = JSON.parse(localStorage.getItem('abuEbaCodes') || '[]');
            
            if (existingCodes.includes(code)) {
                return false;
            }
            
            // Store the code
            existingCodes.push(code);
            localStorage.setItem('abuEbaCodes', JSON.stringify(existingCodes));
            
            return true;
        }

        function showMessage(type, text) {
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>
