<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABU EBA - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ktzh-blue: #0066CC;
            --ktzh-cyan: #00A0E0;
            --ktzh-lightblue: #E8F4F8;
            --ktzh-darkgray: #3C3C3B;
            --ktzh-gray: #767676;
            --white: #FFFFFF;
            --error: #EF4444;
            --success: #10B981;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: var(--ktzh-darkgray);
            line-height: 1.6;
            background: linear-gradient(135deg, var(--ktzh-blue) 0%, var(--ktzh-cyan) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-container {
            background: var(--white);
            border-radius: 30px;
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .logo h1 {
            font-size: 2rem;
            color: var(--ktzh-blue);
            margin-bottom: 0.5rem;
        }

        .logo p {
            color: var(--ktzh-gray);
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--ktzh-darkgray);
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--ktzh-lightblue);
            border-radius: 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--ktzh-blue);
            box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1);
        }

        .helper-text {
            font-size: 0.875rem;
            color: var(--ktzh-gray);
            margin-top: 0.5rem;
        }

        .btn {
            width: 100%;
            padding: 1.25rem;
            border: none;
            border-radius: 20px;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--ktzh-blue), var(--ktzh-cyan));
            color: var(--white);
            box-shadow: 0 8px 24px rgba(0, 102, 204, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0, 102, 204, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            padding: 1rem;
            border-radius: 15px;
            margin-top: 1rem;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 2px solid var(--error);
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 2px solid var(--success);
        }

        .links {
            margin-top: 2rem;
            text-align: center;
        }

        .link {
            display: block;
            margin-top: 1rem;
            color: var(--ktzh-blue);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .link:hover {
            color: var(--ktzh-cyan);
        }

        .divider {
            margin: 2rem 0;
            text-align: center;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: var(--ktzh-lightblue);
        }

        .divider span {
            position: relative;
            background: var(--white);
            padding: 0 1rem;
            color: var(--ktzh-gray);
            font-size: 0.875rem;
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">🔐</div>
            <h1>Login</h1>
            <p>Melde dich mit deinem Code an</p>
        </div>

        <form id="loginForm">
            <!-- Code Input -->
            <div class="form-group">
                <label for="code">Dein Code</label>
                <input 
                    type="text" 
                    id="code" 
                    placeholder="NAME-25-🚀-1234" 
                    required
                    autocomplete="off"
                >
                <div class="helper-text">Format: NAME-JAHR-SYMBOL-PIN</div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary" id="submitBtn">
                🚀 Einloggen
            </button>

            <!-- Message -->
            <div id="message" class="message"></div>
        </form>

        <div class="divider">
            <span>oder</span>
        </div>

        <div class="links">
            <a href="code-erstellen.html" class="link">✨ Neuen Code erstellen</a>
            <a href="welcome-back.html" class="link">← Zurück</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const codeInput = document.getElementById('code');
        const messageDiv = document.getElementById('message');

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const code = codeInput.value.trim();
            
            // Validate format
            const codeParts = code.split('-');
            if (codeParts.length !== 4) {
                showMessage('error', '❌ Ungültiges Code-Format. Bitte verwende: NAME-JAHR-SYMBOL-PIN');
                return;
            }

            const [name, year, symbol, pin] = codeParts;

            // Basic validation
            if (name.length === 0 || year.length !== 2 || pin.length !== 4 || !/^[0-9]{4}$/.test(pin)) {
                showMessage('error', '❌ Ungültiger Code. Bitte überprüfe deine Eingabe.');
                return;
            }

            // Check if code exists
            const existingCodes = JSON.parse(localStorage.getItem('abuEbaCodes') || '[]');
            
            if (existingCodes.includes(code)) {
                showMessage('success', '✅ Login erfolgreich! Du wirst weitergeleitet...');
                
                // Store code
                localStorage.setItem('abuEbaCode', code);
                localStorage.setItem('abuEbaName', name);
                
                // Redirect after 1.5 seconds
                setTimeout(() => {
                    window.location.href = 'startzweig.html';
                }, 1500);
            } else {
                showMessage('error', '❌ Code nicht gefunden. Hast du bereits einen Code erstellt?');
            }
        });

        function showMessage(type, text) {
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
        }

        // Format code input (automatically add dashes)
        codeInput.addEventListener('input', (e) => {
            let value = e.target.value;
            
            // Remove all non-alphanumeric characters except emoji and dashes
            // This is a simplified approach - in production, you might want more sophisticated emoji handling
            
            // Auto-capitalize the name part if it's the first segment
            const parts = value.split('-');
            if (parts[0]) {
                parts[0] = parts[0].toUpperCase();
                e.target.value = parts.join('-');
            }
        });
    </script>
</body>
</html>
