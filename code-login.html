<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABU EBA - Login erstellen</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ktzh-blue: #0066CC;
            --ktzh-cyan: #00A0E0;
            --ktzh-lightblue: #E8F4F8;
            --ktzh-darkgray: #3C3C3B;
            --ktzh-gray: #767676;
            --white: #FFFFFF;
            --error: #EF4444;
            --success: #10B981;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: var(--ktzh-darkgray);
            line-height: 1.6;
            background: linear-gradient(135deg, var(--ktzh-blue) 0%, var(--ktzh-cyan) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-container {
            background: var(--white);
            border-radius: 30px;
            padding: 3rem;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .logo h1 {
            font-size: 2rem;
            color: var(--ktzh-blue);
            margin-bottom: 0.5rem;
        }

        .logo p {
            color: var(--ktzh-gray);
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--ktzh-darkgray);
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--ktzh-lightblue);
            border-radius: 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--ktzh-blue);
            box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1);
        }

        .symbol-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .symbol-option {
            aspect-ratio: 1;
            border: 2px solid var(--ktzh-lightblue);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--white);
        }

        .symbol-option:hover {
            transform: scale(1.1);
            border-color: var(--ktzh-cyan);
            background: var(--ktzh-lightblue);
        }

        .symbol-option.selected {
            border-color: var(--ktzh-blue);
            background: var(--ktzh-blue);
            transform: scale(1.15);
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        }

        .helper-text {
            font-size: 0.875rem;
            color: var(--ktzh-gray);
            margin-top: 0.5rem;
        }

        .code-preview {
            background: var(--ktzh-lightblue);
            padding: 1.5rem;
            border-radius: 15px;
            text-align: center;
            margin: 2rem 0;
            border: 2px solid var(--ktzh-cyan);
        }

        .code-preview-label {
            font-size: 0.875rem;
            color: var(--ktzh-gray);
            margin-bottom: 0.5rem;
        }

        .code-preview-text {
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--ktzh-blue);
        }

        .btn {
            width: 100%;
            padding: 1.25rem;
            border: none;
            border-radius: 20px;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--ktzh-blue), var(--ktzh-cyan));
            color: var(--white);
            box-shadow: 0 8px 24px rgba(0, 102, 204, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0, 102, 204, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            padding: 1rem;
            border-radius: 15px;
            margin-top: 1rem;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 2px solid var(--error);
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 2px solid var(--success);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 2rem;
            color: var(--ktzh-blue);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: var(--ktzh-cyan);
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 2rem;
            }

            .symbol-grid {
                grid-template-columns: repeat(5, 1fr);
            }

            .symbol-option {
                font-size: 1.2rem;
            }

            .code-preview-text {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">🎓</div>
            <h1>Login erstellen</h1>
            <p>Erstelle deinen persönlichen Zugang</p>
        </div>

        <form id="loginForm">
            <!-- Name -->
            <div class="form-group">
                <label for="name">Dein Vorname</label>
                <input 
                    type="text" 
                    id="name" 
                    placeholder="Max" 
                    required
                    maxlength="20"
                    autocomplete="off"
                >
                <div class="helper-text">Nur Buchstaben, keine Zahlen oder Sonderzeichen</div>
            </div>

            <!-- Year -->
            <div class="form-group">
                <label for="year">Dein Lehrjahr</label>
                <select id="year" required>
                    <option value="">Bitte wählen...</option>
                    <option value="25">2025</option>
                    <option value="26">2026</option>
                    <option value="27">2027</option>
                    <option value="28">2028</option>
                    <option value="29">2029</option>
                    <option value="30">2030</option>
                </select>
            </div>

            <!-- Symbol -->
            <div class="form-group">
                <label>Wähle dein Symbol (50 zur Auswahl)</label>
                <input type="hidden" id="symbol" required>
                <div class="symbol-grid" id="symbolGrid"></div>
                <div class="helper-text">Wähle ein Symbol, das dir gefällt</div>
            </div>

            <!-- PIN -->
            <div class="form-group">
                <label for="pin">Dein PIN (4 Ziffern)</label>
                <input 
                    type="text" 
                    id="pin" 
                    placeholder="1234" 
                    required
                    maxlength="4"
                    pattern="[0-9]{4}"
                    autocomplete="off"
                >
                <div class="helper-text">Merke dir diesen PIN gut!</div>
            </div>

            <!-- Code Preview -->
            <div class="code-preview">
                <div class="code-preview-label">Dein Code wird sein:</div>
                <div class="code-preview-text" id="codePreview">___-__-?-____</div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary" id="submitBtn" disabled>
                Code erstellen & einloggen
            </button>

            <!-- Message -->
            <div id="message" class="message"></div>
        </form>

        <a href="index.html" class="back-link">← Zurück</a>
    </div>

    <script>
        // Firebase Config
        let firebaseConfig = null;
        let db = null;
        let auth = null;
        let useFirebase = false;

        // Try to load Firebase config
        try {
            if (typeof window.firebaseConfig !== 'undefined') {
                firebaseConfig = window.firebaseConfig;
            }
        } catch (e) {
            console.log('📦 Firebase config not found, using localStorage fallback');
        }

        // Try to initialize Firebase
        setTimeout(() => {
            if (typeof firebase !== 'undefined' && firebaseConfig) {
                try {
                    if (!firebase.apps.length) {
                        firebase.initializeApp(firebaseConfig);
                    }
                    db = firebase.firestore();
                    auth = firebase.auth();
                    useFirebase = true;
                    console.log('🔥 Firebase initialized!');
                } catch (error) {
                    console.log('📦 Firebase initialization failed, using localStorage');
                    console.error(error);
                }
            } else {
                console.log('📦 Firebase not configured, using localStorage');
            }
        }, 100);

        // Available symbols (50 choices)
        const symbols = [
            '🦁', '🌟', '⚡', '🎨', '🚀', '💎', '🌈', '🔥', '🌺', '🎯',
            '🍯', '🦄', '🌸', '⭐', '💫', '🎭', '🎪', '🎬', '🎵', '🎸',
            '⚽', '🏀', '🎾', '🏆', '🎮', '🎲', '🧩', '🎰', '🎳', '🎯',
            '🌍', '🌙', '☀️', '⛅', '🌊', '🏔️', '🌴', '🍀', '🌻', '🌹',
            '🦋', '🐝', '🐞', '🦜', '🐬', '🦈', '🐙', '🦀', '🐢', '🦎'
        ];

        // Elements
        const form = document.getElementById('loginForm');
        const nameInput = document.getElementById('name');
        const yearSelect = document.getElementById('year');
        const symbolInput = document.getElementById('symbol');
        const symbolGrid = document.getElementById('symbolGrid');
        const pinInput = document.getElementById('pin');
        const codePreview = document.getElementById('codePreview');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');

        // Render symbols
        console.log('🎨 Rendering 50 symbols...');
        symbols.forEach(symbol => {
            const div = document.createElement('div');
            div.className = 'symbol-option';
            div.textContent = symbol;
            div.addEventListener('click', () => selectSymbol(symbol, div));
            symbolGrid.appendChild(div);
        });

        // Select symbol
        function selectSymbol(symbol, element) {
            document.querySelectorAll('.symbol-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            element.classList.add('selected');
            symbolInput.value = symbol;
            updatePreview();
            checkFormValidity();
        }

        // Update code preview
        function updatePreview() {
            const name = nameInput.value.trim().toUpperCase() || '___';
            const year = yearSelect.value || '__';
            const symbol = symbolInput.value || '?';
            const pin = pinInput.value || '____';
            
            codePreview.textContent = `${name}-${year}-${symbol}-${pin}`;
        }

        // Check form validity
        function checkFormValidity() {
            const isValid = 
                nameInput.value.trim().length > 0 &&
                yearSelect.value !== '' &&
                symbolInput.value !== '' &&
                pinInput.value.length === 4 &&
                /^[0-9]{4}$/.test(pinInput.value);
            
            submitBtn.disabled = !isValid;
        }

        nameInput.addEventListener('input', () => {
            nameInput.value = nameInput.value.replace(/[^a-zA-ZäöüÄÖÜ]/g, '');
            updatePreview();
            checkFormValidity();
        });

        yearSelect.addEventListener('change', () => {
            updatePreview();
            checkFormValidity();
        });

        pinInput.addEventListener('input', () => {
            pinInput.value = pinInput.value.replace(/[^0-9]/g, '');
            updatePreview();
            checkFormValidity();
        });

        // Simple PIN hash
        function hashPin(pin) {
            let hash = 0;
            const str = pin + 'ABU_EBA_SALT_2024';
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return hash.toString(36);
        }

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = nameInput.value.trim().toUpperCase();
            const year = yearSelect.value;
            const symbol = symbolInput.value;
            const pin = pinInput.value;
            const code = `${name}-${year}-${symbol}-${pin}`;
            
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Erstelle Code...';
            
            try {
                if (useFirebase && auth && db) {
                    // Firebase path
                    console.log('🔥 Using Firebase...');
                    const codeDoc = await db.collection('userCodes').doc(code).get();
                    
                    if (codeDoc.exists) {
                        throw new Error('CODE_EXISTS');
                    }
                    
                    const userCredential = await auth.signInAnonymously();
                    const uid = userCredential.user.uid;
                    
                    await db.collection('userCodes').doc(code).set({
                        code, name, year, symbol,
                        pinHash: hashPin(pin),
                        uid,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    await db.collection('users').doc(uid).set({
                        name, code, symbol, year,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        progress: { completedTopics: [], portfolioEntries: 0, points: 0, badges: [] }
                    });
                    
                    localStorage.setItem('abuEbaCode', code);
                    localStorage.setItem('abuEbaName', name);
                    localStorage.setItem('abuEbaUid', uid);
                    
                    showMessage('success', '✅ Code in Firebase erstellt!');
                    console.log('✅ Firebase UID:', uid);
                } else {
                    // localStorage fallback
                    console.log('📦 Using localStorage...');
                    const existingCodes = JSON.parse(localStorage.getItem('abuEbaCodes') || '[]');
                    
                    if (existingCodes.includes(code)) {
                        throw new Error('CODE_EXISTS');
                    }
                    
                    existingCodes.push(code);
                    localStorage.setItem('abuEbaCodes', JSON.stringify(existingCodes));
                    localStorage.setItem('abuEbaCode', code);
                    localStorage.setItem('abuEbaName', name);
                    
                    showMessage('success', '✅ Code erstellt (localStorage)!');
                }
                
                setTimeout(() => {
                    window.location.href = 'startzweig.html';
                }, 2000);
                
            } catch (error) {
                console.error('❌ Error:', error);
                
                let msg = '❌ Fehler aufgetreten';
                if (error.message === 'CODE_EXISTS') {
                    msg = '❌ Code bereits vergeben. Wähle anderes Symbol/PIN.';
                } else if (error.code === 'permission-denied') {
                    msg = '❌ Firebase-Berechtigung fehlt';
                } else if (error.code === 'unavailable') {
                    msg = '❌ Firebase nicht erreichbar';
                }
                
                showMessage('error', msg);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Code erstellen & einloggen';
            }
        });

        function showMessage(type, text) {
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>
