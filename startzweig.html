<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABU EBA - Lernpfad wählen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ktzh-blue: #0066CC;
            --ktzh-cyan: #00A0E0;
            --ktzh-lightblue: #E8F4F8;
            --ktzh-darkgray: #3C3C3B;
            --ktzh-gray: #767676;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: var(--ktzh-darkgray);
            line-height: 1.6;
            background: linear-gradient(135deg, var(--ktzh-blue) 0%, var(--ktzh-cyan) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            background: var(--white);
            border-radius: 30px;
            padding: 3rem;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .success-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            animation: bounce 1s ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        h1 {
            font-size: 2.5rem;
            color: var(--ktzh-blue);
            margin-bottom: 1rem;
        }

        .user-greeting {
            font-size: 1.5rem;
            color: var(--ktzh-darkgray);
            margin-bottom: 2rem;
        }

        .user-info {
            background: var(--ktzh-lightblue);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .info-item {
            padding: 1rem;
        }

        .info-label {
            font-size: 0.875rem;
            color: var(--ktzh-gray);
            margin-bottom: 0.5rem;
        }

        .info-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--ktzh-blue);
        }

        .info-value.symbol {
            font-size: 2rem;
        }

        .info-value.code {
            font-family: 'Courier New', monospace;
        }

        .message {
            background: rgba(16, 185, 129, 0.1);
            color: #10B981;
            border: 2px solid #10B981;
            padding: 1.5rem;
            border-radius: 20px;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .placeholder {
            padding: 3rem;
            background: var(--ktzh-lightblue);
            border-radius: 20px;
            color: var(--ktzh-gray);
        }

        .placeholder h2 {
            color: var(--ktzh-blue);
            margin-bottom: 1rem;
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-decoration: none;
            display: inline-block;
            margin: 0.5rem;
        }

        .btn-primary {
            background: var(--ktzh-blue);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--ktzh-cyan);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--white);
            color: var(--ktzh-blue);
            border: 2px solid var(--ktzh-blue);
        }

        .btn-secondary:hover {
            background: var(--ktzh-lightblue);
        }

        @media (max-width: 768px) {
            .container {
                padding: 2rem;
            }

            h1 {
                font-size: 2rem;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">🎉</div>
        <h1>Login erfolgreich!</h1>
        <div class="user-greeting">Willkommen, <span id="userName"></span>!</div>

        <div class="message">
            ✅ Du bist jetzt eingeloggt und kannst mit dem Lernen starten!
        </div>

        <div class="user-info">
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Dein Symbol</div>
                    <div class="info-value symbol" id="userSymbol"></div>
                </div>
                <div class="info-item">
                    <div class="info-label">Dein Code</div>
                    <div class="info-value code" id="userCode"></div>
                </div>
                <div class="info-item">
                    <div class="info-label">Lehrstart</div>
                    <div class="info-value" id="userYear"></div>
                </div>
            </div>
        </div>

        <div class="placeholder">
            <h2>🚧 In Entwicklung</h2>
            <p>
                Hier wirst du bald deine Lernpfade auswählen können:<br>
                <strong>Thema 1-8</strong> aus dem ABU EBA Lehrplan
            </p>
        </div>

        <div style="margin-top: 2rem;">
            <a href="index.html" class="btn btn-primary">🏠 Zur Startseite</a>
            <button onclick="logout()" class="btn btn-secondary">🚪 Logout</button>
        </div>
    </div>

    <script>
        // Load user data
        const userName = localStorage.getItem('abuEbaName');
        const userCode = localStorage.getItem('abuEbaCode');

        // If no login data found, redirect to index
        if (!userName || !userCode) {
            window.location.href = 'index.html';
        }

        // Extract data from code (format: NAME-YEAR-SYMBOL-PIN)
        const codeParts = userCode.split('-');
        const userSymbol = codeParts.length >= 3 ? codeParts[2] : '❓';
        const userYear = codeParts.length >= 2 ? '20' + codeParts[1] : '----';

        // Display user info
        document.getElementById('userName').textContent = userName;
        document.getElementById('userSymbol').textContent = userSymbol;
        document.getElementById('userCode').textContent = userCode;
        document.getElementById('userYear').textContent = userYear;

        // Logout function
        function logout() {
            if (confirm('Möchtest du dich wirklich ausloggen?')) {
                localStorage.removeItem('abuEbaCode');
                localStorage.removeItem('abuEbaName');
                window.location.href = 'index.html';
            }
        }

        // Celebrate animation
        const icon = document.querySelector('.success-icon');
        setInterval(() => {
            icon.style.transform = 'rotate(360deg)';
            setTimeout(() => {
                icon.style.transform = 'rotate(0deg)';
            }, 500);
        }, 5000);
    </script>
</body>
</html>
