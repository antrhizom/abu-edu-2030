        // Initialisierung
        window.addEventListener('load', async function() {
            document.getElementById('currentYear').textContent = new Date().getFullYear();
            
            userId = localStorage.getItem('ant_edu_user_id');
            if (!userId) {
                window.location.href = 'index.html';
                return;
            }
            
            renderKompetenzen();
            await loadProgress();
            setupEventListeners();
        });
        
        function renderKompetenzen() {
            const grid = document.getElementById('kompetenzGrid');
            grid.innerHTML = kompetenzen.map(k => `
                <div class="kompetenz-card" data-kompetenz="${k.id}">
                    <div class="card-header">
                        <span class="card-icon">${k.icon}</span>
                        <span class="status-badge">Noch nicht geübt</span>
                    </div>
                    <h3 class="card-title">${k.title}</h3>
                    <p class="card-description">${k.description}</p>
                    <button class="card-button">Üben ←’</button>
                </div>
            `).join('');
        }
        
        function setupEventListeners() {
            document.querySelectorAll('.kompetenz-card').forEach(card => {
                const button = card.querySelector('.card-button');
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const kompetenzId = card.getAttribute('data-kompetenz');
                    openUebung(kompetenzId);
                });
            });
            
            document.getElementById('closeModal').addEventListener('click', closeModal);
            document.getElementById('uebungModal').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });
        }
        
        async function loadProgress() {
            try {
                const userRef = doc(db, 'users', userId);
                const aktivitaetenRef = doc(db, 'aktivitaeten', userId);
                
                const [userDoc, aktivitaetenDoc] = await Promise.all([
                    getDoc(userRef),
                    getDoc(aktivitaetenRef)
                ]);
                
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    const schluessel = data.kompetenzen?.schluessel || {};
                    
                    const count = Object.keys(schluessel).length;
                    document.getElementById('progressCount').textContent = `${count}/12`;
                    document.getElementById('progressBar').style.width = `${(count/12)*100}%`;
                    
                    Object.keys(schluessel).forEach(kompetenzId => {
                        updateCardStatus(kompetenzId, 'completed');
                    });
                }
                
                // Check for in-progress activities
                if (aktivitaetenDoc.exists()) {
                    const aktivitaeten = aktivitaetenDoc.data().schluesselkompetenzen || {};
                    Object.entries(aktivitaeten).forEach(([kompetenzId, data]) => {
                        if (data.status === 'in-progress' && !isActivityCompleted(kompetenzId)) {
                            updateCardStatus(kompetenzId, 'in-progress');
                        }
                    });
                }
            } catch (error) {
                console.log('Offline oder Fehler:', error);
            }
        }
        
        function isActivityCompleted(kompetenzId) {
            const card = document.querySelector(`[data-kompetenz="${kompetenzId}"]`);
            return card && card.classList.contains('completed');
        }
        
        function updateCardStatus(kompetenzId, status) {
            const card = document.querySelector(`[data-kompetenz="${kompetenzId}"]`);
            if (card) {
                card.classList.remove('completed', 'in-progress');
                card.classList.add(status);
                
                const badge = card.querySelector('.status-badge');
                const button = card.querySelector('.card-button');
                
                if (status === 'completed') {
                    badge.textContent = 'âœ… Geübt';
                    badge.classList.add('completed');
                    button.textContent = 'Erneut üben ←’';
                } else if (status === 'in-progress') {
                    badge.textContent = 'â³ In Arbeit';
                    badge.classList.add('in-progress');
                    button.textContent = 'Weiterarbeiten ←’';
                }
            }
        }
        
        async function openUebung(kompetenzId) {
            currentKompetenz = kompetenzId;
            const komp = kompetenzen.find(k => k.id === kompetenzId);
            
            document.getElementById('modalTitle').textContent = komp.title;
            
            // Load existing activity data
            await loadActivityData(kompetenzId);
            
            // Generate exercise content
            const content = generateExercise(komp);
            document.getElementById('modalBody').innerHTML = content;
            
            // Restore saved data
            restoreActivityData();
            
            // Setup listeners
            setTimeout(() => {
                setupActivityListeners();
                setupAutoSave();
            }, 100);
            
            document.getElementById('uebungModal').classList.add('show');
        }
        
        async function loadActivityData(kompetenzId) {
            try {
                const aktivitaetenRef = doc(db, 'aktivitaeten', userId);
                const aktivitaetenDoc = await getDoc(aktivitaetenRef);
                
                if (aktivitaetenDoc.exists()) {
                    const data = aktivitaetenDoc.data();
                    currentActivityData = data.schluesselkompetenzen?.[kompetenzId] || {};
                    selectedEmojis = currentActivityData.reflexion?.emojis || [];
                } else {
                    currentActivityData = {};
                    selectedEmojis = [];
                }
            } catch (error) {
                console.log('Fehler beim Laden:', error);
                currentActivityData = {};
                selectedEmojis = [];
            }
        }
        
        function restoreActivityData() {
            if (!currentActivityData.activity) return;
            
            const activity = currentActivityData.activity;
            
            // Restore input fields
            Object.entries(activity).forEach(([key, value]) => {
                const element = document.getElementById(key);
                if (element) {
                    if (element.type === 'checkbox') {
                        element.checked = value;
                    } else if (element.tagName === 'TEXTAREA' || element.tagName === 'INPUT') {
                        element.value = value;
                        // Update timeline items if filled
                        const timelineItem = element.closest('.timeline-item');
                        if (timelineItem && value) {
                            timelineItem.classList.add('filled');
                        }
                    }
                }
            });
            
            // Restore ratings
            document.querySelectorAll('.rating-container').forEach(container => {
                const name = container.dataset.name;
                if (activity[name]) {
                    const option = container.querySelector(`[data-value="${activity[name]}"]`);
                    if (option) option.classList.add('selected');
                }
            });
            
            // Restore choices
            document.querySelectorAll('[data-name]').forEach(element => {
                const name = element.dataset.name;
                if (activity[name] && element.dataset.value === activity[name]) {
                    element.classList.add('selected');
                }
            });
            
            // Restore emojis
            updateSelectedEmojis();
            
            // Restore notizen
            const notizenField = document.getElementById('notizenField');
            if (notizenField && currentActivityData.reflexion?.notizen) {
                notizenField.value = currentActivityData.reflexion.notizen;
            }
        }
        
        function setupAutoSave() {
            const inputs = document.querySelectorAll('input, textarea, select');
            inputs.forEach(input => {
                input.addEventListener('input', triggerAutoSave);
                input.addEventListener('change', triggerAutoSave);
            });
        }
        
        function triggerAutoSave() {
            clearTimeout(autoSaveTimeout);
            autoSaveTimeout = setTimeout(async () => {
                await saveActivityData(false);
                showAutoSaveIndicator();
            }, 2000);
        }
        
        async function saveActivityData(markCompleted = false) {
            try {
                const aktivitaetenRef = doc(db, 'aktivitaeten', userId);
                const aktivitaetenDoc = await getDoc(aktivitaetenRef);
                
                let aktivitaeten = {};
                if (aktivitaetenDoc.exists()) {
                    aktivitaeten = aktivitaetenDoc.data();
                }
                
                if (!aktivitaeten.schluesselkompetenzen) {
                    aktivitaeten.schluesselkompetenzen = {};
                }
                
                // Collect current activity data
                const activity = collectActivityData();
                
                aktivitaeten.schluesselkompetenzen[currentKompetenz] = {
                    status: markCompleted ? 'completed' : 'in-progress',
                    activity: activity,
                    reflexion: {
                        emojis: selectedEmojis,
                        notizen: document.getElementById('notizenField')?.value || ''
                    },
                    lastUpdated: new Date().toISOString()
                };
                
                await setDoc(aktivitaetenRef, aktivitaeten);
                
                if (!markCompleted) {
                    updateCardStatus(currentKompetenz, 'in-progress');
                }
            } catch (error) {
                console.error('Fehler beim Speichern:', error);
            }
        }
        
        function collectActivityData() {
            const data = {};
            const inputs = document.querySelectorAll('input, textarea, select');
            
            inputs.forEach(input => {
                if (input.id || input.name) {
                    const key = input.id || input.name;
                    if (key === 'notizenField') return; // Skip, handled separately
                    
                    if (input.type === 'checkbox') {
                        data[key] = input.checked;
                    } else if (input.type === 'radio') {
                        if (input.checked) {
                            data[key] = input.value;
                        }
                    } else {
                        data[key] = input.value;
                    }
                }
            });
            
            // Collect selected ratings
            document.querySelectorAll('.rating-option.selected').forEach(option => {
                const container = option.closest('.rating-container');
                if (container && container.dataset.name) {
                    data[container.dataset.name] = option.dataset.value;
                }
            });
            
            // Collect selected choices
            document.querySelectorAll('.choice-btn.selected').forEach(choice => {
                if (choice.dataset.name) {
                    data[choice.dataset.name] = choice.dataset.value;
                }
            });
            
            // Capture the exercise title
            const exerciseTitle = document.querySelector('.exercise-title');
            if (exerciseTitle) {
                data.uebungstyp = exerciseTitle.textContent.trim();
            }
            
            return data;
        }
        
        function showAutoSaveIndicator() {
            const indicator = document.getElementById('autoSaveIndicator');
            indicator.classList.add('show');
            setTimeout(() => {
                indicator.classList.remove('show');
            }, 2000);
        }
        
        function closeModal() {
            document.getElementById('uebungModal').classList.remove('show');
            currentKompetenz = null;
            currentActivityData = {};
        }

        // ==================== INTERACTIVE FUNCTIONS ====================
        
        function setupActivityListeners() {
            // Character counter for notizen
            const notizenField = document.getElementById('notizenField');
            const charCount = document.getElementById('charCount');
            
            if (notizenField && charCount) {
                charCount.textContent = notizenField.value.length;
                notizenField.addEventListener('input', function() {
                    charCount.textContent = this.value.length;
                });
            }
            
            // Update emoji buttons based on saved selection
            document.querySelectorAll('.emoji-btn').forEach(btn => {
                const emoji = btn.dataset.emoji;
                if (selectedEmojis.includes(emoji)) {
                    btn.classList.add('selected');
                }
                
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    toggleEmoji(emoji);
                });
            });
            
            // Rating options
            document.querySelectorAll('.rating-option').forEach(option => {
                option.addEventListener('click', function() {
                    selectRating(this);
                });
            });
            
            // Choice buttons
            document.querySelectorAll('.choice-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    selectChoice(this);
                });
            });
            
            // Timeline inputs
            document.querySelectorAll('.timeline-item input').forEach(input => {
                input.addEventListener('input', function() {
                    const timelineItem = this.closest('.timeline-item');
                    if (this.value.trim()) {
                        timelineItem.classList.add('filled');
                    } else {
                        timelineItem.classList.remove('filled');
                    }
                });
            });
            
            // Action buttons
            document.getElementById('speichernBtn').addEventListener('click', markAsCompleted);
            document.getElementById('portfolioBtn').addEventListener('click', saveToPortfolio);
            document.getElementById('abbrechenBtn').addEventListener('click', closeModal);
            
            updateSelectedEmojis();
        }
        
        function selectRating(element) {
            const container = element.closest('.rating-container');
            container.querySelectorAll('.rating-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            element.classList.add('selected');
            triggerAutoSave();
        }
        
        function selectChoice(element) {
            const name = element.dataset.name;
            document.querySelectorAll(`[data-name="${name}"]`).forEach(btn => {
                btn.classList.remove('selected');
            });
            element.classList.add('selected');
            triggerAutoSave();
        }
        
        function toggleEmoji(emoji) {
            const index = selectedEmojis.indexOf(emoji);
            const btn = document.querySelector(`.emoji-btn[data-emoji="${emoji}"]`);
            
            if (index > -1) {
                selectedEmojis.splice(index, 1);
                btn.classList.remove('selected');
            } else {
                selectedEmojis.push(emoji);
                btn.classList.add('selected');
            }
            
            updateSelectedEmojis();
            triggerAutoSave();
        }
        
        function updateSelectedEmojis() {
            const container = document.getElementById('selectedEmojis');
            if (!container) return;
            
            if (selectedEmojis.length === 0) {
                container.innerHTML = '<span class="emoji-placeholder">Klicke auf Emojis...</span>';
            } else {
                container.innerHTML = selectedEmojis.map(e => `<span class="selected-emoji">${e}</span>`).join('');
            }
        }
        
        async function markAsCompleted() {
            if (selectedEmojis.length === 0) {
                alert('Bitte wähle mindestens ein Emoji als Reflexion!');
                return;
            }
            
            try {
                const userRef = doc(db, 'users', userId);
                const userDoc = await getDoc(userRef);
                
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    const schluessel = data.kompetenzen?.schluessel || {};
                    
                    schluessel[currentKompetenz] = {
                        completed: true,
                        reflexion: selectedEmojis.join(''),
                        timestamp: new Date().toISOString()
                    };
                    
                    await updateDoc(userRef, {
                        'kompetenzen.schluessel': schluessel
                    });
                    
                    // Save activity data with completed status
                    await saveActivityData(true);
                    
                    updateCardStatus(currentKompetenz, 'completed');
                    await loadProgress();
                    closeModal();
                    
                    alert('âœ… Als geübt markiert!\n\nReflexion: ' + selectedEmojis.join(' '));
                }
            } catch (error) {
                console.error('Fehler:', error);
                alert('Fehler beim Speichern. Versuche es nochmal.');
            }
        }

                    const portfolio = data.portfolio || [];
                    
                    // Collect performance data
                    const performanzData = collectActivityData();
                    const notizen = document.getElementById('notizenField')?.value.trim() || '';
                    
                    // Mark as completed
                    schluessel[currentKompetenz] = {
                        completed: true,
                        reflexion: selectedEmojis.join(''),
                        timestamp: new Date().toISOString()
                    };
                    
                    // Create portfolio entry
                    const komp = kompetenzen.find(k => k.id === currentKompetenz);
                    const portfolioEntry = {
                        id: 'sk_' + currentKompetenz.replace(/\./g, '_') + '_' + Date.now(),
                        type: 'schluesselkompetenz',
                        kompetenzId: currentKompetenz,
                        kompetenzTitle: komp.title,
                        thema: komp.thema,
                        aspekte: komp.aspekte,
                        sprachmodi: komp.sprachmodi,
                        performanz: performanzData,
                        reflexion: selectedEmojis.join(''),
                        notizen: notizen,
                        createdAt: new Date().toISOString(),
                        shareable: true
                    };
                    
                    portfolio.push(portfolioEntry);
                    
                    await updateDoc(userRef, {
                        'kompetenzen.schluessel': schluessel,
                        'portfolio': portfolio
                    });
                    
                    // Save activity data with completed status
                    await saveActivityData(true);
                    
                    updateCardStatus(currentKompetenz, 'completed');
                    await loadProgress();
                    closeModal();
                    
                    let successMsg = 'ðŸ“‚ Ins Portfolio gespeichert!\n\nâœ“ Kompetenz als geübt markiert\nâœ“ Performanz dokumentiert\nâœ“ Reflexion: ' + selectedEmojis.join(' ');
                    if (notizen) {
                        successMsg += '\nâœ“ Notizen gespeichert';
                    }
                    alert(successMsg);
                }
            } catch (error) {
                console.error('Fehler:', error);
                alert('Fehler beim Speichern. Versuche es nochmal.');
            }
        }
        
    </script>
</body>
</html>
