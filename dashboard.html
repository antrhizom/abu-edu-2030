<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ant edu - Lernen vernetzt gedacht</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'ant-primary': '#8B4513',
                        'ant-secondary': '#D2691E',
                        'ant-accent': '#FF6B35',
                        'ant-success': '#4CAF50',
                        'ant-network': '#2196F3',
                        'ant-bg': '#FFF8F0',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #FFF8F0 0%, #FFE4D0 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        /* Zirkuläre Animation für das Logo */
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .circle-animation {
            animation: rotate 20s linear infinite;
        }
        
        /* Schwebende Punkte im Hintergrund (Vernetzung) */
        .network-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(139, 69, 19, 0.2);
            border-radius: 50%;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        .float-1 { animation: float 3s ease-in-out infinite; }
        .float-2 { animation: float 4s ease-in-out infinite 0.5s; }
        .float-3 { animation: float 5s ease-in-out infinite 1s; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- Vernetzungs-Punkte im Hintergrund -->
    <div class="network-dot float-1" style="top: 10%; left: 15%;"></div>
    <div class="network-dot float-2" style="top: 30%; right: 20%;"></div>
    <div class="network-dot float-3" style="bottom: 20%; left: 25%;"></div>
    <div class="network-dot float-1" style="top: 60%; right: 15%;"></div>
    <div class="network-dot float-2" style="bottom: 30%; right: 30%;"></div>
    
    <!-- Hauptcontainer -->
    <div class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl p-8 md:p-12 relative z-10">
        
        <!-- Logo & Branding -->
        <div class="text-center mb-8">
            <!-- Zirkuläres Element -->
            <div class="relative inline-block mb-4">
                <div class="absolute inset-0 border-4 border-ant-secondary rounded-full opacity-20 circle-animation" style="width: 80px; height: 80px;"></div>
                <div class="text-5xl mb-2 relative z-10">
                    📚
                </div>
            </div>
            
            <h1 class="text-4xl font-bold text-ant-primary mb-2">
                SLP ABU 2030
            </h1>
            <p class="text-ant-secondary text-lg">
                Schullehrplan Allgemeinbildung
            </p>
        </div>
        
        <!-- Beschreibung -->
        <div class="bg-ant-bg rounded-2xl p-6 mb-8 border-2 border-ant-secondary/20">
            <div class="flex items-start gap-3">
                <span class="text-3xl">📚</span>
                <div>
                    <h2 class="text-xl font-semibold text-ant-primary mb-2">
                        Digitale Lernplattform für ABU
                    </h2>
                    <p class="text-gray-700 leading-relaxed">
                        Allgemeinbildender Unterricht für die <strong>EBA-Ausbildung</strong> nach dem neuen Schullehrplan 2030
                    </p>
                </div>
            </div>
        </div>
        
        <!-- Login-Button -->
        <div class="text-center">
            <button 
                id="loginBtn"
                class="bg-ant-accent hover:bg-ant-secondary text-white font-bold py-4 px-8 rounded-full text-xl transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl"
            >
                Los geht's! 🐾
            </button>
            
            <p class="text-gray-500 text-sm mt-4">
                Dein Zugang wird automatisch erstellt
            </p>
        </div>
        
        <!-- Zirkuläres Vernetzungs-Symbol unten -->
        <div class="mt-8 flex justify-center">
            <svg width="60" height="60" viewBox="0 0 60 60" class="opacity-20">
                <circle cx="30" cy="30" r="25" fill="none" stroke="#8B4513" stroke-width="2"/>
                <circle cx="30" cy="5" r="3" fill="#8B4513"/>
                <circle cx="55" cy="30" r="3" fill="#D2691E"/>
                <circle cx="30" cy="55" r="3" fill="#FF6B35"/>
                <circle cx="5" cy="30" r="3" fill="#2196F3"/>
                <line x1="30" y1="5" x2="55" y2="30" stroke="#8B4513" stroke-width="1" opacity="0.3"/>
                <line x1="55" y1="30" x2="30" y2="55" stroke="#8B4513" stroke-width="1" opacity="0.3"/>
                <line x1="30" y1="55" x2="5" y2="30" stroke="#8B4513" stroke-width="1" opacity="0.3"/>
                <line x1="5" y1="30" x2="30" y2="5" stroke="#8B4513" stroke-width="1" opacity="0.3"/>
            </svg>
        </div>
        
        <!-- Footer / Impressum -->
        <div class="mt-6 pt-6 border-t border-gray-200 text-center">
            <div class="flex items-center justify-center gap-2 text-xs text-gray-400">
                <span class="text-lg">🐜✏️👓</span>
                <span>|</span>
                <span id="currentYear"></span>
            </div>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <script type="module">
        // Firebase v9 SDK
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getFirestore, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyDycvEwK6KJZyFEtsGIaHJBhIFTp5L4cdA",
            authDomain: "abueba2030.firebaseapp.com",
            projectId: "abueba2030",
            storageBucket: "abueba2030.firebasestorage.app",
            messagingSenderId: "592718816412",
            appId: "1:592718816412:web:366e44efabba256d48b959"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // Tier-Namen und Sonderzeichen
        const tiere = [
            'Eichhörnchen', 'Fuchs', 'Bär', 'Ameise', 'Eule', 
            'Igel', 'Hase', 'Reh', 'Dachs', 'Maus',
            'Biber', 'Marder', 'Luchs', 'Wolf', 'Hirsch'
        ];
        
        const sonderzeichen = ['+', '%', '-'];
        
        function generiereNamen() {
            const tier = tiere[Math.floor(Math.random() * tiere.length)];
            const zeichen = sonderzeichen[Math.floor(Math.random() * sonderzeichen.length)];
            return `${tier} ${zeichen}`;
        }
        
        function getUserId() {
            let userId = localStorage.getItem('ant_edu_user_id');
            if (!userId) {
                userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('ant_edu_user_id', userId);
            }
            return userId;
        }
        
        document.getElementById('loginBtn').addEventListener('click', async function() {
            const btn = this;
            btn.disabled = true;
            btn.innerHTML = 'Einen Moment... 🐜';
            
            try {
                const userId = getUserId();
                console.log('User ID:', userId);
                
                const userDoc = await getDoc(doc(db, 'users', userId));
                console.log('User existiert:', userDoc.exists());
                
                if (!userDoc.exists()) {
                    const displayName = generiereNamen();
                    console.log('Erstelle neuen User:', displayName);
                    
                    await setDoc(doc(db, 'users', userId), {
                        profile: {
                            displayName: displayName,
                            createdAt: new Date().toISOString()
                        },
                        kompetenzen: {
                            schluessel: {},
                            aspekte: {},
                            sprachmodi: {}
                        },
                        challenges: 0,
                        umsetzungen: 0
                    });
                    
                    localStorage.setItem('ant_edu_display_name', displayName);
                    console.log('User erstellt in Firestore!');
                } else {
                    const displayName = userDoc.data().profile.displayName;
                    localStorage.setItem('ant_edu_display_name', displayName);
                    console.log('Bestehender User geladen:', displayName);
                }
                
                window.location.href = 'dashboard.html';
                
            } catch (error) {
                console.error('Login-Fehler:', error);
                btn.disabled = false;
                btn.innerHTML = 'Los geht\'s! 🐾';
                alert('Fehler: ' + error.message);
            }
        });
        
        window.addEventListener('load', function() {
            const userId = localStorage.getItem('ant_edu_user_id');
            const displayName = localStorage.getItem('ant_edu_display_name');
            
            if (userId && displayName) {
                const btn = document.getElementById('loginBtn');
                btn.innerHTML = 'Zurück zu meinem Lernen 🐾';
            }
            
            document.getElementById('currentYear').textContent = new Date().getFullYear();
        });
    </script>
</body>
</html>
