<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Portfolio - SLP ABU 2030</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'ant-primary': '#8B4513',
                        'ant-secondary': '#D2691E',
                        'ant-accent': '#FF6B35',
                        'ant-success': '#4CAF50',
                        'ant-network': '#2196F3',
                        'ant-bg': '#FFF8F0',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #FFF8F0 0%, #FFE4D0 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        .portfolio-item {
            transition: all 0.3s ease;
        }
        
        .portfolio-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(139, 69, 19, 0.15);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    
    <div class="max-w-6xl mx-auto">
        
        <!-- Header -->
        <div class="bg-white rounded-3xl shadow-xl p-6 md:p-8 mb-8">
            <div class="flex items-center justify-between flex-wrap gap-4">
                <div class="flex items-center gap-4">
                    <a href="dashboard.html" class="text-3xl hover:scale-110 transition-transform">←</a>
                    <div>
                        <h1 class="text-3xl md:text-4xl font-bold text-ant-primary mb-2">
                            Mein Portfolio
                        </h1>
                        <p class="text-gray-600" id="welcomeText">
                            Hier siehst du alle deine Arbeiten
                        </p>
                    </div>
                </div>
                <div class="text-6xl">📁</div>
            </div>
        </div>
        
        <!-- Schnellstatistik -->
        <div class="grid md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white rounded-2xl shadow-lg p-6 text-center">
                <div class="text-4xl mb-2">📝</div>
                <div class="text-3xl font-bold text-ant-primary" id="totalItems">0</div>
                <div class="text-sm text-gray-600">Arbeiten</div>
            </div>
            <div class="bg-white rounded-2xl shadow-lg p-6 text-center">
                <div class="text-4xl mb-2">🌍</div>
                <div class="text-3xl font-bold text-ant-accent" id="publicItems">0</div>
                <div class="text-sm text-gray-600">Öffentlich</div>
            </div>
            <div class="bg-white rounded-2xl shadow-lg p-6 text-center">
                <div class="text-4xl mb-2">❤️</div>
                <div class="text-3xl font-bold text-ant-success" id="totalLikes">0</div>
                <div class="text-sm text-gray-600">Likes erhalten</div>
            </div>
        </div>
        
        <!-- Neue Arbeit hinzufügen -->
        <div class="bg-white rounded-3xl shadow-xl p-6 md:p-8 mb-8">
            <h2 class="text-2xl font-bold text-ant-primary mb-6 flex items-center gap-3">
                <span>➕</span>
                <span>Neue Arbeit hinzufügen</span>
            </h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Titel</label>
                    <input type="text" id="newTitle" 
                           class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-ant-accent focus:outline-none"
                           placeholder="z.B. Meine E-Mail an die Berufsschule">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Beschreibung</label>
                    <textarea id="newDescription" rows="4"
                              class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-ant-accent focus:outline-none"
                              placeholder="Beschreibe kurz deine Arbeit..."></textarea>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Kompetenzbereich</label>
                    <select id="newKompetenz" 
                            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-ant-accent focus:outline-none">
                        <option value="schluessel">🔑 Schlüsselkompetenzen</option>
                        <option value="aspekte">🎯 Gesellschaftliche Aspekte</option>
                        <option value="sprach">💬 Sprachmodi</option>
                    </select>
                </div>
                
                <div class="flex items-center gap-3 p-4 bg-ant-bg rounded-xl">
                    <input type="checkbox" id="newPublic" class="w-5 h-5 text-ant-accent rounded">
                    <label for="newPublic" class="text-sm font-semibold text-gray-700">
                        🌍 Für Community öffentlich machen
                    </label>
                </div>
                
                <button onclick="addPortfolioItem()" 
                        class="w-full bg-ant-accent hover:bg-ant-secondary text-white font-bold py-4 px-6 rounded-full transition-all transform hover:scale-105">
                    Arbeit hinzufügen 🚀
                </button>
            </div>
        </div>
        
        <!-- Portfolio Items -->
        <div class="bg-white rounded-3xl shadow-xl p-6 md:p-8 mb-8">
            <h2 class="text-2xl font-bold text-ant-primary mb-6 flex items-center gap-3">
                <span>📚</span>
                <span>Meine Arbeiten</span>
            </h2>
            
            <div id="portfolioList" class="space-y-4">
                <!-- Wird dynamisch gefüllt -->
                <div class="text-center py-12 text-gray-400">
                    <div class="text-5xl mb-4">📭</div>
                    <p>Noch keine Arbeiten vorhanden.</p>
                    <p class="text-sm mt-2">Füge oben deine erste Arbeit hinzu!</p>
                </div>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="text-center">
            <div class="bg-white/50 backdrop-blur rounded-full px-6 py-3 inline-block">
                <div class="flex items-center gap-2 text-sm text-gray-600">
                    <span class="text-lg">🐜✏️👓</span>
                    <span>|</span>
                    <span id="currentYear"></span>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyDycvEwK6KJZyFEtsGIaHJBhIFTp5L4cdA",
            authDomain: "abueba2030.firebaseapp.com",
            projectId: "abueba2030",
            storageBucket: "abueba2030.firebasestorage.app",
            messagingSenderId: "592718816412",
            appId: "1:592718816412:web:366e44efabba256d48b959"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let userId = null;
        let displayName = '';
        let portfolioData = [];
        
        window.addEventListener('load', async function() {
            document.getElementById('currentYear').textContent = new Date().getFullYear();
            
            userId = localStorage.getItem('ant_edu_user_id');
            displayName = localStorage.getItem('ant_edu_display_name');
            
            if (!userId) {
                window.location.href = 'index.html';
                return;
            }
            
            document.getElementById('welcomeText').textContent = `Willkommen ${displayName}! Hier siehst du alle deine Arbeiten.`;
            
            await loadPortfolio();
        });
        
        async function loadPortfolio() {
            try {
                const userDoc = await getDoc(doc(db, 'users', userId));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    portfolioData = data.portfolio || [];
                    
                    renderPortfolio();
                    updateStats();
                }
            } catch (error) {
                console.error('Fehler beim Laden:', error);
                alert('Fehler beim Laden der Daten: ' + error.message);
            }
        }
        
        function renderPortfolio() {
            const container = document.getElementById('portfolioList');
            
            if (portfolioData.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-400">
                        <div class="text-5xl mb-4">📭</div>
                        <p>Noch keine Arbeiten vorhanden.</p>
                        <p class="text-sm mt-2">Füge oben deine erste Arbeit hinzu!</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = portfolioData.map((item, index) => {
                const kompetenzColors = {
                    'schluessel': 'ant-primary',
                    'aspekte': 'ant-secondary',
                    'sprach': 'ant-accent'
                };
                const color = kompetenzColors[item.kompetenz] || 'ant-primary';
                
                const kompetenzIcons = {
                    'schluessel': '🔑',
                    'aspekte': '🎯',
                    'sprach': '💬'
                };
                const icon = kompetenzIcons[item.kompetenz] || '📝';
                
                return `
                    <div class="portfolio-item border-2 border-gray-200 rounded-2xl p-6 bg-gradient-to-br from-white to-${color}/5">
                        <div class="flex items-start justify-between mb-4">
                            <div class="flex items-start gap-4 flex-1">
                                <span class="text-4xl">${icon}</span>
                                <div class="flex-1">
                                    <h3 class="text-xl font-bold text-${color} mb-2">${item.title}</h3>
                                    <p class="text-gray-700 text-sm mb-3">${item.description}</p>
                                    <div class="flex items-center gap-4 text-xs text-gray-500">
                                        <span>📅 ${new Date(item.createdAt).toLocaleDateString('de-DE')}</span>
                                        ${item.isPublic ? '<span class="text-ant-success font-semibold">🌍 Öffentlich</span>' : '<span class="text-gray-400">🔒 Privat</span>'}
                                        ${item.likes ? `<span class="text-red-500">❤️ ${item.likes}</span>` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex gap-2 flex-wrap">
                            <button onclick="togglePublic(${index})" 
                                    class="px-4 py-2 rounded-full text-sm font-semibold ${item.isPublic ? 'bg-gray-200 text-gray-700' : 'bg-ant-success text-white'} hover:opacity-80 transition-all">
                                ${item.isPublic ? '🔒 Privat machen' : '🌍 Öffentlich machen'}
                            </button>
                            <button onclick="shareItem(${index})" 
                                    class="px-4 py-2 bg-ant-network text-white rounded-full text-sm font-semibold hover:opacity-80 transition-all">
                                🔗 Link teilen
                            </button>
                            <button onclick="downloadItem(${index})" 
                                    class="px-4 py-2 bg-ant-accent text-white rounded-full text-sm font-semibold hover:opacity-80 transition-all">
                                📥 Herunterladen
                            </button>
                            <button onclick="deleteItem(${index})" 
                                    class="px-4 py-2 bg-red-500 text-white rounded-full text-sm font-semibold hover:opacity-80 transition-all">
                                🗑️ Löschen
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function updateStats() {
            const total = portfolioData.length;
            const publicCount = portfolioData.filter(item => item.isPublic).length;
            const totalLikes = portfolioData.reduce((sum, item) => sum + (item.likes || 0), 0);
            
            document.getElementById('totalItems').textContent = total;
            document.getElementById('publicItems').textContent = publicCount;
            document.getElementById('totalLikes').textContent = totalLikes;
        }
        
        window.addPortfolioItem = async function() {
            const title = document.getElementById('newTitle').value.trim();
            const description = document.getElementById('newDescription').value.trim();
            const kompetenz = document.getElementById('newKompetenz').value;
            const isPublic = document.getElementById('newPublic').checked;
            
            if (!title || !description) {
                alert('Bitte fülle Titel und Beschreibung aus!');
                return;
            }
            
            const newItem = {
                id: Date.now().toString(),
                title: title,
                description: description,
                kompetenz: kompetenz,
                isPublic: isPublic,
                createdAt: new Date().toISOString(),
                likes: 0,
                userId: userId,
                userName: displayName
            };
            
            portfolioData.unshift(newItem);
            
            try {
                await updateDoc(doc(db, 'users', userId), {
                    portfolio: portfolioData
                });
                
                // Wenn öffentlich, auch in Community-Collection speichern
                if (isPublic) {
                    await setDoc(doc(db, 'community', newItem.id), newItem);
                }
                
                renderPortfolio();
                updateStats();
                
                // Formular leeren
                document.getElementById('newTitle').value = '';
                document.getElementById('newDescription').value = '';
                document.getElementById('newPublic').checked = false;
                
                alert('✅ Arbeit erfolgreich hinzugefügt!');
            } catch (error) {
                console.error('Fehler:', error);
                alert('❌ Fehler beim Speichern: ' + error.message);
            }
        };
        
        window.togglePublic = async function(index) {
            portfolioData[index].isPublic = !portfolioData[index].isPublic;
            
            try {
                await updateDoc(doc(db, 'users', userId), {
                    portfolio: portfolioData
                });
                
                const item = portfolioData[index];
                
                if (item.isPublic) {
                    // In Community hochladen
                    await setDoc(doc(db, 'community', item.id), item);
                } else {
                    // Aus Community entfernen (würde deleteDoc benötigen)
                    // Für jetzt nur in portfolio aktualisieren
                }
                
                renderPortfolio();
                updateStats();
            } catch (error) {
                console.error('Fehler:', error);
                alert('❌ Fehler: ' + error.message);
            }
        };
        
        window.shareItem = function(index) {
            const item = portfolioData[index];
            const shareUrl = `${window.location.origin}/community.html?item=${item.id}`;
            
            if (navigator.share) {
                navigator.share({
                    title: item.title,
                    text: item.description,
                    url: shareUrl
                });
            } else {
                navigator.clipboard.writeText(shareUrl);
                alert('🔗 Link kopiert!\n\n' + shareUrl);
            }
        };
        
        window.downloadItem = function(index) {
            const item = portfolioData[index];
            
            const content = `
# ${item.title}

**Erstellt am:** ${new Date(item.createdAt).toLocaleDateString('de-DE')}
**Kompetenzbereich:** ${item.kompetenz}
**Von:** ${displayName}

## Beschreibung

${item.description}

---
Erstellt mit SLP ABU 2030 - ant edu 🐜✏️👓
            `;
            
            const blob = new Blob([content], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${item.title.replace(/[^a-z0-9]/gi, '_')}.md`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };
        
        window.deleteItem = async function(index) {
            if (!confirm('Möchtest du diese Arbeit wirklich löschen?')) {
                return;
            }
            
            portfolioData.splice(index, 1);
            
            try {
                await updateDoc(doc(db, 'users', userId), {
                    portfolio: portfolioData
                });
                
                renderPortfolio();
                updateStats();
                alert('✅ Arbeit gelöscht!');
            } catch (error) {
                console.error('Fehler:', error);
                alert('❌ Fehler: ' + error.message);
            }
        };
    </script>
</body>
</html>
