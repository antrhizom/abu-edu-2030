<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - LocalStorage Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ktzh-blue: #0066CC;
            --ktzh-cyan: #00A0E0;
            --ktzh-lightblue: #E8F4F8;
            --ktzh-darkgray: #3C3C3B;
            --ktzh-gray: #767676;
            --white: #FFFFFF;
            --green: #10B981;
            --red: #EF4444;
            --orange: #F59E0B;
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--ktzh-darkgray);
            color: var(--white);
            padding: 2rem;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: var(--ktzh-cyan);
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        .section {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--ktzh-blue);
        }

        .section h2 {
            color: var(--ktzh-cyan);
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }

        .status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 5px;
            font-weight: 700;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        .status.found {
            background: var(--green);
            color: var(--white);
        }

        .status.notfound {
            background: var(--red);
            color: var(--white);
        }

        .status.warning {
            background: var(--orange);
            color: var(--white);
        }

        .data-item {
            margin-bottom: 1rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
        }

        .data-label {
            color: var(--ktzh-cyan);
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .data-value {
            color: var(--white);
            word-break: break-all;
        }

        .data-value.empty {
            color: var(--ktzh-gray);
            font-style: italic;
        }

        .code-display {
            font-size: 1.5rem;
            color: var(--ktzh-cyan);
            font-weight: 700;
            padding: 1rem;
            background: rgba(0, 102, 204, 0.2);
            border-radius: 8px;
            text-align: center;
            margin: 1rem 0;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--ktzh-blue);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--ktzh-cyan);
        }

        .btn-danger {
            background: var(--red);
            color: var(--white);
        }

        .btn-danger:hover {
            background: #DC2626;
        }

        .btn-warning {
            background: var(--orange);
            color: var(--white);
        }

        .btn-warning:hover {
            background: #D97706;
        }

        .info-box {
            background: rgba(0, 160, 224, 0.1);
            border: 2px solid var(--ktzh-cyan);
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .info-box p {
            margin-bottom: 0.5rem;
        }

        .info-box p:last-child {
            margin-bottom: 0;
        }

        pre {
            background: rgba(0, 0, 0, 0.5);
            padding: 1rem;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 0.875rem;
        }

        .all-storage {
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 LocalStorage Debug Tool</h1>
        
        <!-- Current Login Status -->
        <div class="section">
            <h2>📊 Aktueller Login-Status</h2>
            <div id="loginStatus"></div>
        </div>

        <!-- Current Code -->
        <div class="section">
            <h2>🎫 Dein aktueller Code</h2>
            <div id="currentCode"></div>
        </div>

        <!-- All Registered Codes -->
        <div class="section">
            <h2>📚 Alle registrierten Codes</h2>
            <div id="allCodes"></div>
        </div>

        <!-- All localStorage Content -->
        <div class="section">
            <h2>💾 Kompletter localStorage Inhalt</h2>
            <div id="allStorage" class="all-storage"></div>
        </div>

        <!-- Actions -->
        <div class="section">
            <h2>🛠️ Aktionen</h2>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="window.location.reload()">
                    🔄 Aktualisieren
                </button>
                <button class="btn btn-warning" onclick="testLogin()">
                    🧪 Test-Login erstellen
                </button>
                <button class="btn btn-danger" onclick="clearAllData()">
                    🗑️ Alle Daten löschen
                </button>
            </div>
            
            <div class="info-box">
                <p><strong>ℹ️ Info:</strong></p>
                <p>Dieses Tool zeigt dir, was in deinem Browser gespeichert ist.</p>
                <p>Wenn keine Daten vorhanden sind, musst du erst einen Code erstellen.</p>
            </div>
        </div>
    </div>

    <script>
        function checkLoginStatus() {
            const code = localStorage.getItem('abuEbaCode');
            const name = localStorage.getItem('abuEbaName');
            const allCodes = JSON.parse(localStorage.getItem('abuEbaCodes') || '[]');

            // Login Status
            const statusDiv = document.getElementById('loginStatus');
            if (code && name) {
                statusDiv.innerHTML = `
                    <div class="status found">✅ EINGELOGGT</div>
                    <div class="data-item">
                        <div class="data-label">Name:</div>
                        <div class="data-value">${name}</div>
                    </div>
                `;
            } else {
                statusDiv.innerHTML = `
                    <div class="status notfound">❌ NICHT EINGELOGGT</div>
                    <p style="color: var(--ktzh-gray); margin-top: 1rem;">
                        Kein aktiver Login gefunden. Du musst erst einen Code erstellen.
                    </p>
                `;
            }

            // Current Code
            const codeDiv = document.getElementById('currentCode');
            if (code) {
                const parts = code.split('-');
                codeDiv.innerHTML = `
                    <div class="code-display">${code}</div>
                    <div class="data-item">
                        <div class="data-label">Aufschlüsselung:</div>
                        <div class="data-value">
                            Name: ${parts[0] || '?'}<br>
                            Jahr: 20${parts[1] || '??'}<br>
                            Symbol: ${parts[2] || '?'}<br>
                            PIN: ${parts[3] ? '••••' : '????'}
                        </div>
                    </div>
                `;
            } else {
                codeDiv.innerHTML = `
                    <div class="data-value empty">Kein Code gespeichert</div>
                `;
            }

            // All Codes
            const allCodesDiv = document.getElementById('allCodes');
            if (allCodes.length > 0) {
                allCodesDiv.innerHTML = `
                    <div class="status found">${allCodes.length} Code(s) registriert</div>
                    ${allCodes.map((c, i) => `
                        <div class="data-item">
                            <div class="data-label">Code ${i + 1}:</div>
                            <div class="data-value">${c}</div>
                        </div>
                    `).join('')}
                `;
            } else {
                allCodesDiv.innerHTML = `
                    <div class="status warning">⚠️ Keine Codes registriert</div>
                    <p style="color: var(--ktzh-gray); margin-top: 1rem;">
                        Es wurden noch keine Codes erstellt.
                    </p>
                `;
            }

            // All localStorage
            const allStorageDiv = document.getElementById('allStorage');
            const allItems = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                allItems.push({ key, value });
            }

            if (allItems.length > 0) {
                allStorageDiv.innerHTML = `
                    <pre>${JSON.stringify(
                        Object.fromEntries(allItems.map(item => [item.key, item.value])), 
                        null, 
                        2
                    )}</pre>
                `;
            } else {
                allStorageDiv.innerHTML = `
                    <div class="data-value empty">localStorage ist leer</div>
                `;
            }
        }

        function testLogin() {
            const testCode = `TEST-25-🔧-1234`;
            const testName = `TEST`;
            
            // Add to codes array
            const codes = JSON.parse(localStorage.getItem('abuEbaCodes') || '[]');
            if (!codes.includes(testCode)) {
                codes.push(testCode);
                localStorage.setItem('abuEbaCodes', JSON.stringify(codes));
            }
            
            // Set as current login
            localStorage.setItem('abuEbaCode', testCode);
            localStorage.setItem('abuEbaName', testName);
            
            alert('✅ Test-Login erstellt: ' + testCode);
            window.location.reload();
        }

        function clearAllData() {
            if (confirm('⚠️ Wirklich ALLE Daten löschen?\n\nDies kann nicht rückgängig gemacht werden!')) {
                // Remove ABU EBA specific items
                localStorage.removeItem('abuEbaCode');
                localStorage.removeItem('abuEbaName');
                localStorage.removeItem('abuEbaCodes');
                
                alert('✅ Alle ABU EBA Daten wurden gelöscht');
                window.location.reload();
            }
        }

        // Run on load
        checkLoginStatus();

        // Auto-refresh every 5 seconds
        setInterval(checkLoginStatus, 5000);
    </script>
</body>
</html>
