        function renderModi() {
            const grid = document.getElementById('modiGrid');
            grid.innerHTML = modi.map(modus => `
                <div class="modus-card" onclick="openModus('${modus.id}')">
                    <div class="modus-header-flex">
                        <span class="modus-icon">${modus.icon}</span>
                        <div style="flex: 1;">
                            <h3 class="modus-title">${modus.title}</h3>
                            <p class="modus-description">${modus.description}</p>
                        </div>
                    </div>
                    <div style="margin-top: 0.75rem;">
                        <span class="uebung-badge">
                            📝 1 Übung
                        </span>
                    </div>
                </div>
            `).join('');
        }
        
        window.openModus = function(modusId) {
            currentModus = modi.find(m => m.id === modusId);
            if (!currentModus) return;
            
            uebungAbgeschlossen = false;
            selectedEmojis = [];
            
            const modal = document.getElementById('modusModal');
            document.getElementById('modalIcon').textContent = currentModus.icon;
            document.getElementById('modalTitle').textContent = currentModus.title;
            document.getElementById('modalSubtitle').textContent = currentModus.description;
            
            const content = document.getElementById('modalContent');
            content.innerHTML = generateModalContent(currentModus);
            
            modal.classList.add('show');
            
            // Event Listeners für Übung hinzufügen
            setupUebungListeners(currentModus.uebung.typ);
            
            // Event Listeners für Emojis hinzufügen (später)
            setTimeout(() => {
                const emojiButtons = document.querySelectorAll('.emoji-btn');
                if (emojiButtons.length > 0) {
                    setupEmojiListeners();
                }
            }, 100);
        };
        
        function generateModalContent(modus) {
            const uebung = modus.uebung;
            
            let html = `
                <div class="uebung-section">
                    <h3 class="uebung-title">${uebung.titel}</h3>
                    <p class="uebung-beschreibung">${uebung.beschreibung}</p>
                    ${generateUebungHTML(uebung)}
                </div>
                
                <div class="portfolio-section" id="portfolioSection" style="display: none;">
                    <h3 class="portfolio-title">💭 Wie war's für dich?</h3>
                    <p class="portfolio-prompt">Wähle ein oder mehrere Emojis als Reflexion:</p>
                    <div class="emoji-buttons" id="emojiButtons">
                        <button class="emoji-btn" data-emoji="😊" title="Hat Spaß gemacht">😊</button>
                        <button class="emoji-btn" data-emoji="💪" title="War anstrengend">💪</button>
                        <button class="emoji-btn" data-emoji="🤔" title="Musste nachdenken">🤔</button>
                        <button class="emoji-btn" data-emoji="❓" title="War unklar">❓</button>
                        <button class="emoji-btn" data-emoji="🔥" title="War super">🔥</button>
                        <button class="emoji-btn" data-emoji="😅" title="War schwierig">😅</button>
                        <button class="emoji-btn" data-emoji="💡" title="Hatte eine Idee">💡</button>
                        <button class="emoji-btn" data-emoji="✅" title="Gut gelaufen">✅</button>
                    </div>
                    <div id="selectedEmojis" class="selected-emojis">
                        <span class="emoji-placeholder" id="emojiPlaceholder">Klicke auf Emojis...</span>
                    </div>
                    <div class="modal-actions">
                        <button onclick="markAsCompleted()" class="btn-save" id="markBtn" disabled>
                            ✅ Als geübt markieren
                        </button>
                        <button onclick="speichernPortfolio()" class="btn-save" id="portfolioBtn" disabled style="background: #2196F3;">
                            📁 Ins Portfolio speichern
                        </button>
                        <button onclick="closeModal()" class="btn-cancel">
                            Abbrechen
                        </button>
                    </div>
                </div>
            `;
            
            return html;
        }
        
        function generateUebungHTML(uebung) {
            let html = '';
            
            if (uebung.typ === 'multiple-choice' || uebung.typ === 'gespraech-situationen' || uebung.typ === 'digital-kommunikation') {
                html += `<div id="uebungContent">`;
                const fragen = uebung.fragen || uebung.situationen || uebung.szenarien;
                fragen.forEach((item, qIndex) => {
                    html += `
                        <div style="margin-bottom: 1.5rem;">
                            <p style="font-weight: 600; margin-bottom: 0.75rem; color: #374151;">
                                ${qIndex + 1}. ${item.frage || item.situation || item.nachricht}
                            </p>
                            <div class="choice-grid">
                                ${item.optionen.map((option, oIndex) => `
                                    <div class="choice-item" data-question="${qIndex}" data-option="${oIndex}">
                                        ${option}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                html += `
                    <button class="check-btn" id="checkBtn">Antworten prüfen</button>
                    <div class="feedback" id="feedback"></div>
                `;
            }
            else if (uebung.typ === 'video-analyse' || uebung.typ === 'praesentation-check') {
                const items = uebung.checkpoints || uebung.schritte;
                html += `<div class="choice-grid">`;
                items.forEach((item, index) => {
                    html += `
                        <label style="display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.75rem; border-radius: 8px; background: #F9FAFB; border: 2px solid #E5E7EB; cursor: pointer;">
                            <input type="checkbox" class="check-item" style="width: 20px; height: 20px; margin-top: 2px; cursor: pointer;">
                            <span style="font-size: 0.875rem;">${item}</span>
                        </label>
                    `;
                });
                html += `</div>`;
                html += `
                    <button class="check-btn" id="checkBtn">Alle Punkte bestätigen</button>
                    <div class="feedback" id="feedback"></div>
                `;
            }
            else if (uebung.typ === 'lese-verstehen') {
                html += `<div class="choice-grid">`;
                uebung.items.forEach((item, index) => {
                    html += `
                        <label style="display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.75rem; border-radius: 8px; background: #F9FAFB; border: 2px solid #E5E7EB; cursor: pointer;">
                            <input type="checkbox" class="check-item" data-korrekt="${item.korrekt}" style="width: 20px; height: 20px; margin-top: 2px; cursor: pointer;">
                            <span style="font-size: 0.875rem;">${item.text}</span>
                        </label>
                    `;
                });
                html += `</div>`;
                html += `
                    <button class="check-btn" id="checkBtn">Auswahl prüfen</button>
                    <div class="feedback" id="feedback"></div>
                `;
            }
            else if (uebung.typ === 'text-schreiben') {
                html += `
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: #374151;">Betreff:</label>
                        <input type="text" class="text-input" id="emailBetreff" placeholder="${uebung.vorlage.betreff}">
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: #374151;">E-Mail Text:</label>
                        <textarea class="text-input" id="emailText" placeholder="Schreibe deine E-Mail hier..."></textarea>
                    </div>
                    <div style="background: #F0F9FF; border: 2px solid #3B82F6; border-radius: 8px; padding: 1rem; margin-bottom: 1rem;">
                        <p style="font-size: 0.875rem; font-weight: 600; color: #1E40AF; margin-bottom: 0.5rem;">✓ Checkliste:</p>
                        ${uebung.vorlage.elemente.map(el => `
                            <div style="font-size: 0.875rem; color: #374151; margin-bottom: 0.25rem;">• ${el}</div>
                        `).join('')}
                    </div>
                    <button class="check-btn" id="checkBtn">E-Mail abschliessen</button>
                    <div class="feedback" id="feedback"></div>
                `;
            }
            else if (uebung.typ === 'sprachbewusstheit') {
                html += `<div id="uebungContent">`;
                uebung.beispiele.forEach((item, index) => {
                    html += `
                        <div style="margin-bottom: 1.5rem; padding: 1rem; background: #F9FAFB; border-radius: 8px; border: 2px solid #E5E7EB;">
                            <p style="font-weight: 600; margin-bottom: 0.75rem; color: #374151;">"${item.satz}"</p>
                            <div style="display: flex; gap: 0.75rem;">
                                ${item.kontext.map((kontext, kIndex) => `
                                    <button class="choice-item" data-question="${index}" data-option="${kIndex}" style="flex: 1; text-align: center;">
                                        ${kontext}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                html += `
                    <button class="check-btn" id="checkBtn">Zuordnung prüfen</button>
                    <div class="feedback" id="feedback"></div>
                `;
            }
            
            return html;
        }
        
        function setupUebungListeners(typ) {
            const checkBtn = document.getElementById('checkBtn');
            if (!checkBtn) return;
            
            if (typ === 'multiple-choice' || typ === 'gespraech-situationen' || typ === 'digital-kommunikation' || typ === 'sprachbewusstheit') {
                document.querySelectorAll('.choice-item').forEach(item => {
                    item.addEventListener('click', function() {
                        if (this.classList.contains('correct') || this.classList.contains('wrong')) return;
                        const question = this.dataset.question;
                        document.querySelectorAll(`[data-question="${question}"]`).forEach(i => {
                            i.classList.remove('selected');
                        });
                        this.classList.add('selected');
                    });
                });
                checkBtn.addEventListener('click', () => checkMultipleChoice());
            }
            else if (typ === 'video-analyse' || typ === 'praesentation-check') {
                checkBtn.addEventListener('click', () => checkCheckboxes());
            }
            else if (typ === 'lese-verstehen') {
                checkBtn.addEventListener('click', () => checkLeseVerstehen());
            }
            else if (typ === 'text-schreiben') {
                checkBtn.addEventListener('click', () => checkTextSchreiben());
            }
        }
        
        function checkMultipleChoice() {
            const uebung = currentModus.uebung;
            const fragen = uebung.fragen || uebung.situationen || uebung.szenarien || uebung.beispiele;
            let correctCount = 0;
            let answeredAll = true;
            
            fragen.forEach((frage, qIndex) => {
                const selected = document.querySelector(`[data-question="${qIndex}"].selected`);
                if (!selected) {
                    answeredAll = false;
                    return;
                }
                
                const selectedOption = parseInt(selected.dataset.option);
                const choiceItems = document.querySelectorAll(`[data-question="${qIndex}"]`);
                
                choiceItems.forEach((item, oIndex) => {
                    item.style.pointerEvents = 'none';
                    if (oIndex === frage.richtig) {
                        item.classList.add('correct');
                        if (oIndex === selectedOption) {
                            correctCount++;
                        }
                    } else if (oIndex === selectedOption) {
                        item.classList.add('wrong');
                    }
                });
            });
            
            if (!answeredAll) {
                showFeedback('⚠️ Bitte beantworte alle Fragen!', false);
                return;
            }
            
            if (correctCount === fragen.length) {
                showFeedback(`✅ Perfekt! Alle ${fragen.length} Antworten sind richtig.`, true);
            } else {
                showFeedback(`Du hast ${correctCount} von ${fragen.length} Fragen richtig beantwortet. Die richtigen Antworten sind grün markiert.`, true, 'partial');
            }
            markUebungComplete();
        }
        
        function checkCheckboxes() {
            const checks = document.querySelectorAll('.check-item');
            const allChecked = Array.from(checks).every(c => c.checked);
            
            if (allChecked) {
                showFeedback('✅ Sehr gut! Alle wichtigen Punkte berücksichtigt.', true);
                markUebungComplete();
            } else {
                showFeedback('⚠️ Bitte markiere alle wichtigen Punkte!', false);
            }
        }
        
        function checkLeseVerstehen() {
            const uebung = currentModus.uebung;
            let correct = 0;
            
            uebung.items.forEach((item, index) => {
                const checkbox = document.querySelectorAll('.check-item')[index];
                const label = checkbox.parentElement;
                
                checkbox.disabled = true;
                label.style.cursor = 'default';
                
                if (checkbox.checked === item.korrekt) {
                    correct++;
                    label.style.borderColor = '#4CAF50';
                    label.style.background = '#D1FAE5';
                } else {
                    label.style.borderColor = '#EF4444';
                    label.style.background = '#FEE2E2';
                }
            });
            
            if (correct === uebung.items.length) {
                showFeedback('✅ Perfekt! Alle Informationen richtig erkannt.', true);
            } else {
                showFeedback(`Du hast ${correct} von ${uebung.items.length} richtig erkannt. Die richtigen sind grün, die falschen rot markiert.`, true, 'partial');
            }
            markUebungComplete();
        }
        
        function checkTextSchreiben() {
            const betreff = document.getElementById('emailBetreff').value.trim();
            const text = document.getElementById('emailText').value.trim();
            
            if (betreff === '' || text === '') {
                showFeedback('⚠️ Bitte fülle Betreff und Text aus!', false);
                return;
            }
            
            if (text.length < 50) {
                showFeedback('⚠️ Deine E-Mail sollte etwas ausführlicher sein (min. 50 Zeichen).', false);
                return;
            }
            
            showFeedback('✅ E-Mail abgeschlossen! Denk daran: Anrede, Anliegen, Frage, Gruss und Name sollten enthalten sein.', true);
            markUebungComplete();
        }
        
        function setupEmojiListeners() {
            const emojiButtons = document.querySelectorAll('.emoji-btn');
            
            emojiButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const emoji = this.dataset.emoji;
                    const index = selectedEmojis.indexOf(emoji);
                    if (index > -1) {
                        selectedEmojis.splice(index, 1);
                    } else {
                        selectedEmojis.push(emoji);
                    }
                    updateSelectedEmojisDisplay();
                    updatePortfolioButton();
                });
            });
        }
        
        function updateSelectedEmojisDisplay() {
            const container = document.getElementById('selectedEmojis');
            const placeholder = document.getElementById('emojiPlaceholder');
            
            if (selectedEmojis.length === 0) {
                placeholder.style.display = 'block';
                container.querySelectorAll('.selected-emoji').forEach(e => e.remove());
            } else {
                placeholder.style.display = 'none';
                container.querySelectorAll('.selected-emoji').forEach(e => e.remove());
                selectedEmojis.forEach(emoji => {
                    const span = document.createElement('span');
                    span.className = 'selected-emoji';
                    span.textContent = emoji;
                    container.appendChild(span);
                });
            }
        }
        
        function updatePortfolioButton() {
            const portfolioBtn = document.getElementById('portfolioBtn');
            const markBtn = document.getElementById('markBtn');
            const hasEmojis = selectedEmojis.length > 0;
            
            if (portfolioBtn) portfolioBtn.disabled = !hasEmojis;
            if (markBtn) markBtn.disabled = !hasEmojis;
        }
        
        function markUebungComplete() {
            uebungAbgeschlossen = true;
            const checkBtn = document.getElementById('checkBtn');
            if (checkBtn) {
                checkBtn.disabled = true;
                checkBtn.textContent = '✓ Übung abgeschlossen';
            }
            
            const portfolioSection = document.getElementById('portfolioSection');
            if (portfolioSection) {
                portfolioSection.style.display = 'block';
                setTimeout(() => setupEmojiListeners(), 100);
            }
        }
        
        function showFeedback(message, success, type = null) {
            const feedback = document.getElementById('feedback');
            feedback.innerHTML = `<p class="feedback-text">${message}</p>`;
            feedback.classList.add('show');
            feedback.classList.remove('success', 'partial');
            if (success) {
                feedback.classList.add('success');
            }
            if (type === 'partial') {
                feedback.classList.add('partial');
            }
        }
        
        window.markAsCompleted = async function() {
            if (selectedEmojis.length === 0) {
                alert('Bitte wähle mindestens ein Emoji als Reflexion!');
                return;
            }
            
            try {
                const userRef = doc(db, 'users', userId);
                const userDoc = await getDoc(userRef);
                
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    const sprachmodi = data.kompetenzen?.sprachmodi || {};
                    
                    sprachmodi[currentModus.id] = {
                        completed: true,
                        reflexion: selectedEmojis.join(''),
                        timestamp: new Date().toISOString()
                    };
                    
                    await updateDoc(userRef, {
                        'kompetenzen.sprachmodi': sprachmodi
                    });
                    
                    alert('✅ Als geübt markiert!\n\nReflexion: ' + selectedEmojis.join(' '));
                    closeModal();
                }
            } catch (error) {
                console.error('Fehler:', error);
                alert('⚠️ Fehler beim Speichern. Bitte überprüfe deine Internetverbindung.');
            }
        };
        
        window.speichernPortfolio = async function() {
            if (selectedEmojis.length === 0) {
                alert('Bitte wähle mindestens ein Emoji als Reflexion!');
                return;
            }
            
            const portfolioItem = {
                id: Date.now().toString(),
                type: 'sprachmodus',
                modusId: currentModus.id,
                kompetenzTitle: currentModus.title + ': ' + currentModus.uebung.titel,
                thema: 'Lernbereich Sprache und Kommunikation',
                beschreibung: currentModus.description,
                reflexion: selectedEmojis.join(''),
                createdAt: new Date().toISOString(),
                shareable: true,
                performanz: {
                    uebungstyp: currentModus.uebung.titel,
                    modusTyp: currentModus.uebung.typ,
                    abgeschlossen: true
                }
            };
            
            try {
                const userRef = doc(db, 'users', userId);
                const userDoc = await getDoc(userRef);
                
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    const sprachmodi = data.kompetenzen?.sprachmodi || {};
                    const portfolio = data.portfolio || [];
                    
                    sprachmodi[currentModus.id] = {
                        completed: true,
                        reflexion: selectedEmojis.join(''),
                        timestamp: new Date().toISOString()
                    };
                    
                    portfolio.push(portfolioItem);
                    
                    await updateDoc(userRef, {
                        'kompetenzen.sprachmodi': sprachmodi,
                        portfolio: portfolio
                    });
                    
                    alert('📁 Ins Portfolio gespeichert!\n\n✓ Sprachmodus als geübt markiert\n✓ Performanz dokumentiert\n✓ Reflexion: ' + selectedEmojis.join(' '));
                    closeModal();
                } else {
                    alert('⚠️ Fehler beim Speichern.');
                }
            } catch (error) {
                console.error('Fehler:', error);
                alert('⚠️ Fehler beim Speichern. Bitte überprüfe deine Internetverbindung.');
            }
        };
        
        window.closeModal = function() {
            const modal = document.getElementById('modusModal');
            modal.classList.remove('show');
            currentModus = null;
            selectedEmojis = [];
            uebungAbgeschlossen = false;
        };
        
        document.getElementById('modusModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
