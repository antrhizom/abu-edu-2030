<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Ansicht - ABU EBA Digital</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --ktzh-blue: #0066CC;
            --ktzh-light-blue: #00A0E0;
            --ktzh-ultra-light: #E8F4F8;
            --ktzh-white: #FFFFFF;
            --ktzh-text: #1a1a1a;
            --ktzh-gray: #666666;
            --ktzh-success: #28a745;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--ktzh-ultra-light) 0%, var(--ktzh-white) 100%);
            color: var(--ktzh-text);
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            background: var(--ktzh-white);
            box-shadow: 0 2px 8px rgba(0, 102, 204, 0.1);
            padding: 1rem 0;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { color: var(--ktzh-blue); font-size: 1.5rem; }

        .view-badge {
            background: #ffc107;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .portfolio-entry {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 102, 204, 0.1);
        }

        .entry-title { color: var(--ktzh-blue); font-size: 1.5rem; margin-bottom: 0.5rem; }
        .entry-date { color: var(--ktzh-gray); font-size: 0.9rem; margin-bottom: 1rem; }
        .entry-content { line-height: 1.8; margin-bottom: 1.5rem; white-space: pre-wrap; }

        .reactions { border-top: 2px solid var(--ktzh-ultra-light); padding-top: 1.5rem; }
        .reaction-item {
            background: var(--ktzh-ultra-light);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0.5rem 0.5rem 0.5rem 0;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid var(--ktzh-ultra-light);
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        button {
            background: white;
            border: 2px solid var(--ktzh-ultra-light);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            margin: 0.5rem 0.5rem 0 0;
        }

        button:hover { background: var(--ktzh-ultra-light); }

        .message {
            background: var(--ktzh-success);
            color: white;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            font-size: 1.2rem;
            color: var(--ktzh-gray);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>ABU EBA Digital - Portfolio Ansicht</h1>
            <div class="view-badge">👁️ Lesemodus (Cloud)</div>
        </div>
    </header>

    <div class="container">
        <h2 id="pageTitle" style="color: var(--ktzh-blue); font-size: 2rem; margin-bottom: 1rem;">📁 Portfolio wird geladen...</h2>
        <p id="pageDescription" style="color: var(--ktzh-gray); margin-bottom: 0.5rem;">Daten werden aus der Cloud geladen...</p>
        <p id="portfolioMeta" style="color: var(--ktzh-gray); margin-bottom: 2rem; font-size: 0.95rem; display: none;"></p>

        <div id="message" style="display: none;"></div>
        <div id="portfolio"></div>
        <div id="loading" class="loading">⏳ Portfolio wird aus der Cloud geladen...</div>
    </div>

    <script>
        // Firebase Configuration - ABU EDU 2030
        const firebaseConfig = {
            apiKey: "AIzaSyDPWkwiCptXi_Ky-yUgrvxrtpRzH1HGd_0",
            authDomain: "abu-edu-2030.firebaseapp.com",
            projectId: "abu-edu-2030",
            storageBucket: "abu-edu-2030.firebasestorage.app",
            messagingSenderId: "895317724223",
            appId: "1:895317724223:web:de551267b1431bea947c8a"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let portfolioCode = '';
        let viewerName = '';

        function getEntryDate(entry) {
            const value = entry.createdAt || entry.date || entry.clientCreatedAt;
            if (!value) return null;
            if (value.toDate) {
                return value.toDate();
            }
            const date = new Date(value);
            return isNaN(date) ? null : date;
        }

        // Load portfolio from URL
        async function loadPortfolio() {
            const urlParams = new URLSearchParams(window.location.search);
            portfolioCode = urlParams.get('code');

            if (!portfolioCode) {
                showError('Kein Portfolio-Code in der URL gefunden.');
                return;
            }

            const metaEl = document.getElementById('portfolioMeta');
            metaEl.textContent = `Portfolio-Code: ${portfolioCode}`;
            metaEl.style.display = 'block';

            console.log('Loading portfolio for:', portfolioCode);

            try {
                const snapshot = await db.collection('portfolios')
                    .where('userCode', '==', portfolioCode)
                    .get();

                const entries = [];
                snapshot.forEach(doc => {
                    entries.push({ id: doc.id, ...doc.data() });
                });

                entries.sort((a, b) => {
                    const dateA = getEntryDate(a);
                    const dateB = getEntryDate(b);
                    if (!dateA && !dateB) return 0;
                    if (!dateA) return 1;
                    if (!dateB) return -1;
                    return dateB - dateA;
                });

                console.log(`Loaded ${entries.length} entries`);

                if (entries.length === 0) {
                    showEmpty();
                } else {
                    displayPortfolio(entries);
                }
            } catch (error) {
                console.error('Load error:', error);
                showError('Fehler: ' + error.message);
            }
        }

        function displayPortfolio(entries) {
            document.getElementById('loading').style.display = 'none';
            const ownerCode = entries[0].userCode || portfolioCode || '–';
            let ownerName = entries[0].userName && entries[0].userName.trim() ? entries[0].userName : '';
            if (!ownerName) {
                ownerName = ownerCode !== '–' ? `Lernende:r (${ownerCode})` : 'Lernende:r';
            }
            document.getElementById('pageTitle').textContent = `📁 Portfolio von ${ownerName}`;
            document.getElementById('pageDescription').textContent = 'Hier kannst du die Portfolio-Einträge einsehen und Rückmeldungen geben.';

            const container = document.getElementById('portfolio');
            container.innerHTML = '';

            entries.forEach((entry, index) => {
                const reactions = entry.reactions || [];
                
                const entryDiv = document.createElement('div');
                entryDiv.className = 'portfolio-entry';
                entryDiv.innerHTML = `
                    <div class="entry-title">${entry.theme || 'Lernaktivität'}</div>
                    <div class="entry-date">${formatDate(getEntryDate(entry))}</div>
                    <div class="entry-content">${entry.reflection}</div>
                    
                    ${entry.module ? `<p style="color: var(--ktzh-gray);"><strong>Modul:</strong> ${entry.module}</p>` : ''}
                    
                    <div class="reactions">
                        <h4 style="color: var(--ktzh-blue); margin-bottom: 1rem;">💬 Rückmeldungen (${reactions.length})</h4>
                        
                        ${reactions.length > 0 ? `
                            <div>
                                ${reactions.map(r => `
                                    <div class="reaction-item">
                                        <span style="font-size: 1.2rem;">${r.emoji}</span>
                                        <strong>${r.meaning}</strong>
                                        <span style="color: var(--ktzh-gray); font-size: 0.9rem;">von ${r.from}</span>
                                    </div>
                                `).join('')}
                            </div>
                        ` : '<p style="color: var(--ktzh-gray); margin-bottom: 1rem;">Noch keine Rückmeldungen.</p>'}
                        
                        <div style="background: #f5f5f5; padding: 1.5rem; border-radius: 8px; margin-top: 1rem;">
                            <div style="margin-bottom: 1rem;">✍️ Deine Rückmeldung:</div>
                            <input type="text" id="name-${index}" placeholder="Dein Name (z.B. Herr Müller)" value="${viewerName}">
                            <div>
                                <button onclick="addReaction('${entry.id}', ${index}, '👍', 'Super!')">👍 Super!</button>
                                <button onclick="addReaction('${entry.id}', ${index}, '💯', 'Perfekt')">💯 Perfekt</button>
                                <button onclick="addReaction('${entry.id}', ${index}, '🎯', 'Genau richtig')">🎯 Genau richtig</button>
                                <button onclick="addReaction('${entry.id}', ${index}, '💡', 'Clever!')">💡 Clever!</button>
                                <button onclick="addReaction('${entry.id}', ${index}, '🌟', 'Toll')">🌟 Toll</button>
                                <button onclick="addReaction('${entry.id}', ${index}, '🚀', 'Weiter so!')">🚀 Weiter so!</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(entryDiv);
            });
        }

        async function addReaction(entryId, index, emoji, meaning) {
            const nameInput = document.getElementById(`name-${index}`);
            const name = nameInput.value.trim();

            if (!name) {
                alert('Bitte gib deinen Namen ein!');
                nameInput.focus();
                return;
            }

            viewerName = name;

            try {
                const reaction = {
                    emoji: emoji,
                    meaning: meaning,
                    from: name,
                    date: new Date().toISOString()
                };

                await db.collection('portfolios').doc(entryId).update({
                    reactions: firebase.firestore.FieldValue.arrayUnion(reaction),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showMessage(`Rückmeldung "${meaning}" wurde hinzugefügt!`);
                setTimeout(() => loadPortfolio(), 1000);
            } catch (error) {
                console.error('Error:', error);
                alert('Fehler: ' + error.message);
            }
        }

        function formatDate(dateInput) {
            if (!dateInput) return '';
            const date = dateInput instanceof Date ? dateInput : new Date(dateInput);
            if (isNaN(date)) return '';
            return date.toLocaleDateString('de-CH', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function showMessage(msg) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = msg;
            messageDiv.className = 'message';
            messageDiv.style.display = 'block';
            setTimeout(() => { messageDiv.style.display = 'none'; }, 3000);
        }

        function showEmpty() {
            document.getElementById('loading').innerHTML = '<div style="text-align: center; padding: 4rem 2rem;"><div style="font-size: 4rem;">📂</div><div style="font-size: 1.2rem;">Keine Einträge gefunden</div></div>';
        }

        function showError(msg) {
            document.getElementById('loading').innerHTML = `<div style="text-align: center; padding: 4rem 2rem; color: #dc3545;"><div style="font-size: 4rem;">⚠️</div><div style="font-size: 1.2rem;">${msg}</div></div>`;
        }

        // Load on page load
        window.addEventListener('DOMContentLoaded', loadPortfolio);
    </script>
</body>
</html>
